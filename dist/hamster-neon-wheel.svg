<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-labelledby="t">
  <title id="t">A hamster running on a glowing neon wheel</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .spokes { animation: spin 7s linear infinite; transform-origin: 150px 115px; }
      .flicker { animation: flicker 4s ease-in-out infinite; }
    }
    @keyframes spin { to { transform: rotate(-360deg); } }
    @keyframes flicker { 50% { opacity: .7; } }
  </style>
  <defs>
